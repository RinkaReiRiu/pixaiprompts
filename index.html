<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Python Chat Viewer</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Segoe UI","Microsoft JhengHei",sans-serif;
    background:#f5f7fb;
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* Header */

.header{
    background:white;
    border-bottom:1px solid #e5e7eb;
    padding:16px 24px;
    font-size:20px;
    font-weight:600;
    color:#333;
}

/* Chat Area */

.chat-container{
    flex:1;
    overflow-y:auto;
    padding:30px 20px;
}

.message-row{
    display:flex;
    margin-bottom:24px;
}

.avatar{
    width:42px;
    height:42px;
    border-radius:50%;
    background:#4f46e5;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    margin-right:12px;
    flex-shrink:0;
}

.message{
    background:white;
    max-width:900px;
    width:fit-content;
    padding:18px 20px;
    border-radius:16px;
    box-shadow:0 2px 8px rgba(0,0,0,0.05);
    white-space:pre-wrap;
    line-height:1.8;
    color:#333;
    font-size:16px;
}

/* Footer */

.footer{
    background:white;
    border-top:1px solid #e5e7eb;
    padding:12px 20px;
    text-align:center;
    color:#888;
    font-size:13px;
}
</style>
</head>

<body>

<div class="header">
    🤖 Python 回覆結果
</div>

<div class="chat-container">

    <div class="message-row">
        <div class="avatar">AI</div>

        <div class="message" id="messageContent">
載入中...
        </div>
    </div>

</div>

<div class="footer">
    Response generated by Python
</div>

<script>

/*
Python 將回覆塞進這個變數即可
*/

const pythonResponse = `
這裡是 Python return 的內容。

例如：

1. 第一點說明
2. 第二點說明
3. 第三點說明

甚至可以有很多段落。

所有換行都會被保留下來。
`;

document.getElementById("messageContent").textContent = pythonResponse;

</script>

</body>
</html>
